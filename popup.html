<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Labels</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="app-header">
        <span class="app-mark" aria-hidden="true">T</span>
        <div>
          <p class="app-kicker">分頁工作標籤</p>
          <h1>Tab Labels</h1>
        </div>
      </header>

      <section class="panel" aria-labelledby="page-title-heading">
        <div class="section-heading">
          <p class="section-label" id="page-title-heading">目前分頁原始標題</p>
          <span class="tab-scope">目前分頁</span>
        </div>
        <p class="title-preview" id="original-title" title="">載入中…</p>
        <p class="host-preview" id="host-preview"></p>

        <div class="current-label-row">
          <p class="current-label" id="current-label" aria-live="polite">
            目前自訂名稱：<span>未設定</span>
          </p>
          <button type="button" class="text-button" id="save-favorite">加入收藏</button>
        </div>

        <form id="label-form" novalidate>
          <label for="label-input">自訂顯示名稱</label>
          <div class="input-row">
            <input
              id="label-input"
              name="label"
              type="text"
              autocomplete="off"
              placeholder="例如：Kizamu｜Codex"
              aria-describedby="input-hint"
              aria-controls="suggestions"
              aria-autocomplete="list"
              enterkeyhint="done"
              autofocus
            >
            <button type="button" class="icon-button" id="clear-input" aria-label="清除輸入" title="清除輸入">清除</button>
          </div>
          <p class="input-hint" id="input-hint">會整理頭尾空白與連續空白；名稱很長時 Chrome 分頁可能截斷。</p>
          <ul class="suggestions" id="suggestions" role="listbox" aria-label="名稱建議" hidden></ul>

          <label class="check-row excluded-choice" id="excluded-choice" hidden>
            <input type="checkbox" id="allow-excluded">
            <span>本次仍允許手動套用（不會解除排除設定）</span>
          </label>

          <div class="actions">
            <button type="submit" class="button button-primary" id="save-button">儲存名稱</button>
            <button type="button" class="button button-secondary" id="restore-button">恢復原名</button>
          </div>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel compact-panel" aria-labelledby="collections-heading">
        <div class="section-heading">
          <h2 id="collections-heading">快速重用名稱</h2>
          <button class="text-button" id="clear-recent" type="button">清除最近</button>
        </div>
        <div class="collection-group">
          <p class="mini-label">收藏</p>
          <div id="favorites-list" class="chip-list" aria-live="polite"></div>
        </div>
        <div class="collection-group">
          <p class="mini-label">最近使用</p>
          <div id="recent-list" class="chip-list" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel compact-panel" aria-labelledby="favicon-heading">
        <div class="section-heading">
          <h2 id="favicon-heading">自訂 favicon</h2>
          <span class="tab-scope">暫時停用</span>
        </div>
        <p class="input-hint">自訂 favicon 暫時停用，正在改善相容性。此版本不會修改網頁的 favicon，也不會在頁面載入後維持 favicon。</p>
      </section>

      <section class="panel compact-panel" aria-labelledby="rules-heading">
        <div class="section-heading">
          <h2 id="rules-heading">自動命名</h2>
          <span id="rule-status" class="muted-text"></span>
        </div>
        <p id="rule-preview" class="pattern-preview">設定名稱後，可將目前網址保存為規則。</p>
        <div class="actions rule-actions">
          <button type="button" class="button button-secondary" id="create-exact">完整網址</button>
          <button type="button" class="button button-secondary" id="create-prefix">網址範圍</button>
        </div>
        <div class="actions">
          <button type="button" class="button button-secondary" id="pause-rule">暫停此分頁規則</button>
          <button type="button" class="button button-secondary" id="resume-rule">重新套用規則</button>
        </div>
      </section>

      <nav class="popup-nav" aria-label="其他功能">
        <button type="button" class="nav-button" id="open-manager">已命名分頁</button>
        <button type="button" class="nav-button" id="open-options">設定與匯入匯出</button>
      </nav>

      <footer class="app-footer">名稱只套用於目前這個分頁</footer>
    </main>

    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
